name: CI

# Build, vet and test on every pull request, and on main so a bad merge shows up
# immediately rather than surprising the next person to open a PR.
on:
  pull_request:
  push:
    branches: [main]

# Read-only: nothing here publishes anything. A token that cannot write is one
# that cannot be misused by a compromised dependency.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A single checkout is enough. go.mod used to redirect
      # github.com/NimoTech/NimoOS-Common to ../NimoOS-Common, so CI had to
      # clone that sibling — with a token, because it was private. The
      # dependency is an ordinary published module now, so there is no sibling
      # to reproduce and no secret to hand out.
      #
      # That also makes this job build the same way an outside contributor's
      # clone does. Nothing here has access to a local NimoOS-Common, so if
      # go.mod ever names a version that does not exist or is too old, CI is
      # where it surfaces.
      - name: Check out NimoOS-Photos
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev

      # Take the toolchain from go.mod so this workflow cannot drift from what
      # the module actually declares.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # CGO_ENABLED=1 matches NimoOS-Build/scripts/deploy.sh, which is what
      # builds the shipped binary. This service also compiles with
      # CGO_ENABLED=0 — go-sqlite3 has a no-cgo stub — but that binary panics
      # the moment it touches the database, so building any other way would
      # make a green run meaningless.
      - name: Build
        env:
          CGO_ENABLED: "1"
        run: go build ./...

      - name: Vet
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./...

  # Runs on every trigger rather than being path-filtered to mlserver/**:
  # GitHub Actions applies `on.<event>.paths` to the whole workflow file, so
  # scoping just this job to a subtree would need either a second workflow
  # file or a manual `git diff`/paths-filter step. That's more moving parts
  # than this buys — the job below is a plain checkout + pip install + pytest
  # (with pip caching), so paying its cost unconditionally is cheap and keeps
  # the workflow boring.
  mlserver-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out NimoOS-Photos
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      # insightface has no prebuilt wheel for cp311/manylinux and compiles
      # from source; build-essential above provides the toolchain. cython
      # and numpy are already pinned inside requirements.txt itself (and
      # ordered ahead of insightface alphabetically), so a single install
      # pass is enough -- same as the throwaway builder stage in
      # mlserver/Dockerfile, which does not do a separate pre-install step
      # either.
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mlserver/requirements.txt

      # --no-deps: requirements.txt is an authoritative, already-flattened
      # lock of the runtime dependency set (see mlserver/Dockerfile for why
      # letting pip resolve deps on its own breaks the cv2 import). Mirrors
      # exactly how the production image installs this file.
      - name: Install Python dependencies
        working-directory: mlserver
        run: pip install --no-deps -r requirements.txt

      # Tests that need real ONNX models under /DATA/.system_data/photos/
      # ml-cache skip themselves via a `skipif not CACHE.exists()` marker
      # (see tests/test_face_shapes.py, tests/test_ocr_shapes.py) -- that
      # directory never exists on a CI runner, so those tests skip cleanly
      # instead of failing; everything else (API contract, CLIP preprocessing
      # math, provider selection, registry lifecycle, OCR session building)
      # runs for real.
      - name: Test
        working-directory: mlserver
        run: pytest tests/ -q
