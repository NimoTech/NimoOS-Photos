name: nimoos-photos-ml

# Photos AI — the immich-machine-learning backend behind NimoOS Photos
# (CLIP search + face recognition). Shipped as an OFFLINE bundle: the image is
# docker-loaded from the tar packaged by script/package-photos-ml.sh, so the
# device never contacts a registry (frozen version, works on isolated/intranet
# installs). AppManagement auto-discovers this running stack and, via the labels
# below, hides it from the user App grid and shows it as "Photos AI".
services:
  immich-machine-learning:
    image: localhost/nimoos-photos-ml:bundled
    pull_policy: never
    ports:
      - "127.0.0.1:3003:3003"
    volumes:
      - type: bind
        source: /DATA/.system_data/photos/ml-cache
        target: /cache
        bind:
          create_host_path: true
    restart: unless-stopped
    # 仅可观测性:docker ps / AppManagement 能直接看到 unhealthy。
    # docker 原生不会因 unhealthy 重启;真正的自愈由 nimoos-photos 内置看门狗负责。
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3003/ping', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s # 对齐 MACHINE_LEARNING_WORKER_TIMEOUT,避免冷加载慢时误报 unhealthy
    labels:
      nimoos.system: "true"            # hide from the user-facing App grid
      nimoos.display_name: "Photos AI" # friendly name in UI / container stats
      icon: "/img/system-apps/photos.svg"
    environment:
      MACHINE_LEARNING_WORKERS: "1"
      # 300s:SigLIP2-SO400M 冷加载在低端盘上可能超过 120s,被 gunicorn 中途
      # 杀掉会留下「端口在听、worker 空壳」的卡死态(2026-07 实际宕机 1.8 天的诱因之一)
      MACHINE_LEARNING_WORKER_TIMEOUT: "300"
      MACHINE_LEARNING_CACHE_FOLDER: "/cache"
      # 闲置 5 分钟自动卸载模型释放内存(nllb-large + PP-OCRv5_server 常驻很吃内存)
      MACHINE_LEARNING_MODEL_TTL: "300"
      MACHINE_LEARNING_MODEL_TTL_POLL_S: "10"
      # 模型缓存随包预置,禁止运行时联网查 HuggingFace(离线/内网机器上会卡超时)
      HF_HUB_OFFLINE: "1"
