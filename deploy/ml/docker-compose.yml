name: nimoos-photos-ml

# Photos AI — the NimoOS in-house mlserver backend behind NimoOS Photos
# (CLIP search + face recognition + OCR). Shipped as an OFFLINE bundle: the
# image is docker-loaded from the tar packaged by script/package-photos-ml.sh,
# so the device never contacts a registry (frozen version, works on
# isolated/intranet installs). AppManagement auto-discovers this running
# stack and, via the labels below, hides it from the user App grid and shows
# it as "Photos AI".
services:
  server:
    image: localhost/nimoos-photos-ml:bundled
    pull_policy: never
    ports:
      - "127.0.0.1:3003:3003"
    volumes:
      - type: bind
        source: ${NIMOOS_PHOTOS_ML_CACHE:-/DATA/.system_data/photos/ml-cache}
        target: /cache
        bind:
          create_host_path: true
    restart: unless-stopped
    # The ML process (SigLIP2/OCR/faces) has repeatedly dragged the whole
    # 31G box into a global OOM in the past; the container needs a hard
    # ceiling. MLSERVER_TTL=300 already unloads models when idle, and 8g
    # ensures multiple co-resident models (CLIP+OCR+faces) aren't killed
    # under normal load.
    mem_limit: 8g
    memswap_limit: 8g
    # Observability only: docker ps / AppManagement can see "unhealthy" directly.
    # Docker itself never restarts on unhealthy; actual self-healing is handled
    # by the built-in watchdog in nimoos-photos.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3003/ping', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s # no gunicorn cold-compile tax here (single uvicorn
      # process, no worker timeout to race); OpenVINO EP compiles are cached
      # under /cache/ov-cache across restarts, so only the very first run on a
      # fresh cache pays the compile cost -- install.sh's readiness poll (up
      # to 300s) covers that case, this start_period just avoids false
      # "unhealthy" during ordinary restarts.
    labels:
      nimoos.system: "true"            # hide from the user-facing App grid
      nimoos.display_name: "Photos AI" # friendly name in UI / container stats
      icon: "/img/system-apps/photos.svg"
    environment:
      MLSERVER_CACHE: "/cache"
      # Auto-unload models after 5 minutes idle to free memory.
      MLSERVER_TTL: "300"
      # auto: use OpenVINO GPU EP when an Intel iGPU is present (see
      # docker-compose.override.yml, installed by install.sh when detected),
      # fall back to CPU otherwise.
      MLSERVER_DEVICE: "auto"
